# Automatic validation.
#
# Why: nothing used to stop a commit from breaking the physics. The suites were
# good but someone had to remember to run them, and this project's most
# expensive failure is the one that does not crash: a plausible number built
# on something impossible.
#
# Two tiers, so that the gate on every push is quick and nothing is dropped:
#
#   fast  (every push, and PRs)  registered fast Python suites, pinned-
#                                dependency check, tsc, pure frontend
#                                verifiers, next build.  A few minutes.
#   slow  (PRs to main, nightly, manual)  the long suites (UNIFAC validators,
#                                multi-minute acceptance suites), one job per
#                                suite, plus the Python-backed frontend
#                                verifiers and the browser check.
#
# Every validator and pytest file belongs to exactly one tier. The tier check
# verifies coverage and the slow matrices against the registry.
#
# Versions are PINNED in requirements.txt on purpose: several checks compare
# against exact values ("benzene/toluene 50/50 = 365.515693 K, bit for bit"),
# which only means something against a fixed 'thermo'. If this workflow starts
# failing without anyone touching the core, first check whether a dependency
# moved.

name: Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly slow tier (03:17 UTC; off the hour on purpose).
    - cron: "17 3 * * *"

concurrency:
  group: validation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # core/mccabe_thiele.py imports matplotlib at module load. A headless runner
  # must be told not to look for a display.
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  core-fast:
    name: Core, fast tier (physics and balances)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for Python-backed verifiers
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Every third-party import is pinned
        run: python tools/ci/check_requirements.py

      - name: Every suite is in exactly one tier
        run: python tools/ci/check_tiers.py

      - name: Fast-tier validation suites
        # run_tests.py exits 0 or 1 for real: one failing check fails the job.
        # Suites under "known_failing" in tools/ci/test_tiers.json are printed
        # but do not fail it (each one has a written reason).
        run: python run_tests.py --tier fast

  core-slow:
    name: Core, slow tier (${{ matrix.suite }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with "slow" in tools/ci/test_tiers.json
        # (tools/ci/check_tiers.py enforces it).
        suite:
          - capa_unifac
          - corte_vertical
          - motor_consolidacion_v2
          - motor_ensamblaje_v2
          - motor_n_componentes
          - motor_unifac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Slow-tier suite
        run: python run_tests.py --tier slow ${{ matrix.suite }}

  pytest-slow:
    name: Pytest, slow tier (${{ matrix.group }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group:
          - group-1
          - group-2
          - group-3
          - group-4
          - group-5
          - group-6
          - group-7
          - group-8
          - group-9
          - group-10
          - group-11
          - group-12
          - group-13
          - group-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for Python-backed verifiers
        working-directory: frontend
        run: npm ci
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Slow pytest group
        run: python run_tests.py --tier slow --group ${{ matrix.group }}

  frontend:
    name: Frontend (types, pure verifiers, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next route types
        # tsc needs the global LayoutProps/PageProps types that Next generates.
        run: npx next typegen

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Pure verifiers (no server, no browser, no Python)
        # Every verificar_*.mjs must be in one of the lists under tools/ci/
        # or this step fails, so a new verifier cannot be left out silently.
        working-directory: .
        run: node tools/ci/run_frontend_verifiers.mjs pure

      - name: Build
        # Any URL: this only checks that it compiles, not that it talks to a
        # backend.
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build

  interface:
    name: Interface (Python-backed verifiers and browser)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # verificar_model_assessment.mjs reads a historical blob with git show.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python-backed frontend verifiers
        # These spawn the Python core themselves; no server needed.
        run: node tools/ci/run_frontend_verifiers.mjs python

      - name: Known-failing verifiers (non-blocking, kept visible)
        continue-on-error: true
        run: node tools/ci/run_frontend_verifiers.mjs quarantine

      - name: Install Chromium
        # puppeteer-core deliberately ships no browser.
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          which chromium-browser || which chromium

      - name: Start the API
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 &
          # Wait for it to answer instead of sleeping an invented number of
          # seconds: the first load imports 'thermo', which is not fast.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/salud && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/salud

      - name: HTTP verifiers (API only)
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
        run: node tools/ci/run_frontend_verifiers.mjs http

      - name: Build and serve the frontend
        working-directory: frontend
        env:
          # The URL is baked in at build time, so it must be the API we just
          # started and not a placeholder.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
        run: |
          npm run build
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ >/dev/null

      - name: Browser check (redesign)
        # verificar_redesign.mjs is the only verifier that drives a browser.
        # It targets localhost:3000 and pages that may predate the current
        # navigation, and it has never run in CI: non-blocking until it has a
        # first green run, then remove continue-on-error.
        continue-on-error: true
        working-directory: frontend
        run: |
          export NAVEGADOR_PRUEBAS="$(which chromium-browser || which chromium)"
          node verificar_redesign.mjs
